<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Hub</title>
<style>
  :root { --bg:#fafafa; --card:#fff; --text:#18181b; --muted:#71717a; --line:#e4e4e7; --accent:#059669; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#09090b; --card:#18181b; --text:#f4f4f5; --muted:#a1a1aa; --line:#27272a; --accent:#10b981; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 24px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:17px; }
  nav button { background:none; border:0; color:var(--muted); font:inherit; padding:6px 10px; cursor:pointer; border-radius:8px; }
  nav button.on { color:var(--text); background:var(--line); }
  main { max-width:1100px; margin:0 auto; padding:24px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .card h2 { margin:0 0 10px; font-size:15px; }
  .muted { color:var(--muted); font-size:12px; }
  ul { list-style:none; margin:0; padding:0; }
  li.row { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line); }
  li.row:first-child { border-top:0; }
  li.row img, .ph { width:34px; height:50px; object-fit:cover; border-radius:4px; background:var(--line); flex:none; }
  li.row .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  a { color:inherit; }
  button.btn { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:8px 14px; font:inherit; cursor:pointer; }
  button.ghost { background:none; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:7px 12px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  input[type=text], textarea { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  textarea { min-height:140px; resize:vertical; }
  .tabs { display:flex; gap:4px; background:var(--line); padding:4px; border-radius:12px; margin-bottom:12px; }
  .tabs button { flex:1; border:0; background:none; color:var(--muted); padding:7px; border-radius:9px; font:inherit; cursor:pointer; }
  .tabs button.on { background:var(--card); color:var(--text); }
  .stack > * + * { margin-top:12px; }
  .compose { max-width:560px; margin:0 auto; }
  .status-pending { color:#d97706; } .status-published { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>📺 Media Hub</h1>
  <nav><button id="nav-dash" class="on">Dashboard</button><button id="nav-new">Nova review</button></nav>
</header>
<main id="app"></main>
<script src="hub.js"></script>
</body>
</html>
